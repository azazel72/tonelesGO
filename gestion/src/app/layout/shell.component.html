<mat-sidenav-container class="shell-container">
  <mat-sidenav [mode]="mode()" [opened]="!isHandset()" class="shell-sidenav">
    <div class="brand">Factory Dashboard</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/app/main-table" routerLinkActive="active-link">Main Table</a>
      <a mat-list-item routerLink="/app/home" routerLinkActive="active-link">Home</a>
      <a mat-list-item routerLink="/app/users" routerLinkActive="active-link">Users</a>
      <a mat-list-item routerLink="/app/settings" routerLinkActive="active-link">Settings</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      <span>Paez Lobato - Gestion</span>
      <span class="spacer"></span>
      <span class="username">{{ user()?.username }}</span>
      <button mat-flat-button color="accent" (click)="logout()">Logout</button>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
