<mat-sidenav-container class="shell-container">
  <mat-sidenav #drawer [mode]="mode()" [opened]="!isHandset()" class="shell-sidenav">
    <div class="brand">
      <div class="brand-mark">
        <mat-icon>factory</mat-icon>
      </div>
      <div class="brand-copy">
        <strong>Factory Suite</strong>
        <span>Operations Dashboard</span>
      </div>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/app/main-table" routerLinkActive="active-link" (click)="isHandset() && drawer.close()">
        <mat-icon matListItemIcon>table_chart</mat-icon>
        <span matListItemTitle>Main Table</span>
      </a>
      <a mat-list-item routerLink="/app/home" routerLinkActive="active-link" (click)="isHandset() && drawer.close()">
        <mat-icon matListItemIcon>space_dashboard</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
      <a mat-list-item routerLink="/app/users" routerLinkActive="active-link" (click)="isHandset() && drawer.close()">
        <mat-icon matListItemIcon>groups</mat-icon>
        <span matListItemTitle>Users</span>
      </a>
      <a mat-list-item routerLink="/app/settings" routerLinkActive="active-link" (click)="isHandset() && drawer.close()">
        <mat-icon matListItemIcon>tune</mat-icon>
        <span matListItemTitle>Settings</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isHandset()) {
        <button mat-icon-button type="button" (click)="drawer.toggle()" aria-label="Open menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="title">Paez Lobato Gestion</span>
      <span class="spacer"></span>
      <div class="user-chip">
        <mat-icon>account_circle</mat-icon>
        <span>{{ user()?.username }}</span>
      </div>
      <button mat-flat-button color="primary" (click)="logout()">Logout</button>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
