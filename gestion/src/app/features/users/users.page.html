<mat-card>
  <mat-card-header>
    <mat-card-title>Users</mat-card-title>
    <mat-card-subtitle>Typed API + inline editing example</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <div class="toolbar">
      <button mat-flat-button color="primary" (click)="refresh()" [disabled]="loading()">Refresh</button>
      <span class="meta">Total: {{ total() }}</span>
    </div>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <ag-grid-angular
      class="ag-theme-quartz grid"
      [rowData]="rowData()"
      [columnDefs]="columnDefs"
      [gridOptions]="gridOptions"
      [animateRows]="true"
    />
  </mat-card-content>
</mat-card>
