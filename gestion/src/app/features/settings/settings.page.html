<mat-card>
  <mat-card-header>
    <mat-card-title>Settings</mat-card-title>
    <mat-card-subtitle>Application-level preferences</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <mat-slide-toggle [checked]="compactGrid()" (change)="compactGrid.set($event.checked)">
      Compact data grid density
    </mat-slide-toggle>
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>API base URL</mat-label>
      <input matInput [value]="apiUrl()" (input)="apiUrl.set($any($event.target).value)" />
    </mat-form-field>
  </mat-card-content>
</mat-card>
